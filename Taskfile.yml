version: '3'

vars:
  APP: build/choco-browser.app

tasks:
  default:
    desc: タスク一覧を表示
    silent: true
    cmds:
      - task --list

  build:
    desc: デバッグビルドして build/choco-browser.app を作成
    cmds:
      - ./scripts/build-app.sh debug

  build:release:
    desc: リリースビルドして build/choco-browser.app を作成
    cmds:
      - ./scripts/build-app.sh release

  dmg:
    desc: リリースビルドして配布用 build/choco-browser-<version>.dmg を作成（VERSION=0.1.0 task dmg）
    cmds:
      - ./scripts/make-dmg.sh

  icon:
    desc: 仮アプリアイコン（AppSupport/AppIcon.icns, site/public/icon.png）を再生成
    cmds:
      - ./scripts/make-icon.sh

  site:dev:
    desc: 紹介サイト（Astro）の開発サーバーを起動 → http://localhost:4321/choco/
    dir: site
    cmds:
      - bun install
      - bun run dev

  site:build:
    desc: 紹介サイトをビルドして site/dist を作成し、型チェックも行う
    dir: site
    cmds:
      - bun install --frozen-lockfile
      - bunx tsc --noEmit
      - bun run build

  site:remotion:
    desc: Remotion Studio を起動してサイトのデモ映像を編集・プレビュー
    dir: site
    cmds:
      - bun install
      - bun run remotion

  site:og:
    desc: SNS 共有用の画像 site/public/og.png を Remotion で再生成
    dir: site
    cmds:
      - bun install
      - bun run og

  run:
    desc: ビルドして choco-browser.app を起動（起動中のアプリは終了してから開き直す）
    deps: [build]
    cmds:
      # open は起動中のアプリを前面に出すだけで再起動しないため、先に終了させる
      - |
        osascript -e 'tell application id "org.ossarc.browser" to quit' >/dev/null 2>&1 || true
        for _ in $(seq 100); do pgrep -qx choco-browser || break; sleep 0.1; done
        pkill -x choco-browser || true
        open {{.APP}}

  test:
    desc: 非UIテストを実行（追加引数は task test -- --filter BrowserAppTests）
    cmds:
      - ./scripts/test.sh {{.CLI_ARGS}}

  test:webkit:
    desc: 実WebKitを必要とするテストも含めて実行
    env:
      OSS_ARC_WEBKIT_TESTS: '1'
    cmds:
      - ./scripts/test.sh {{.CLI_ARGS}}

  test:ui:
    desc: フィクスチャサーバーを起動して XCUITest を実行
    cmds:
      - ./scripts/test-ui.sh {{.CLI_ARGS}}

  test:all:
    desc: 非UIテスト（WebKit含む）とUIテストを順に実行
    cmds:
      - task: test:webkit
      - task: test:ui

  fixture:
    desc: UIテスト用フィクスチャサーバーを単体で起動（port 8765）
    cmds:
      - python3 scripts/fixture-server.py --port 8765

  clean:
    desc: ビルド成果物（.build / build）を削除
    prompt: .build と build を削除します。よろしいですか？
    cmds:
      - rm -rf .build build
