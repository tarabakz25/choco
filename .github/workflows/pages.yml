name: Pages

# site/（Astro + Tailwind CSS + Remotion）をビルドして GitHub Pages に公開する。
# リポジトリの Settings > Pages で Source を "GitHub Actions" にしておく。
on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: site
        run: bun install --frozen-lockfile

      - name: Type check
        working-directory: site
        run: bunx tsc --noEmit

      - name: Build site
        working-directory: site
        run: bun run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
