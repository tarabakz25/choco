name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        id: toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          swift --version
          sw_vers
          version="$(xcodebuild -version | tr '\n' ' ' | tr -c 'A-Za-z0-9.-' '-')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Package.swift', '**/*.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-
            spm-${{ runner.os }}-

      - name: Build
        run: ./scripts/build-app.sh

      - name: Test
        run: ./scripts/test.sh
