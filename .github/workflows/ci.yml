name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        id: toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          swift --version
          sw_vers
          version="$(xcodebuild -version | tr '\n' ' ' | tr -c 'A-Za-z0-9.-' '-')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-build-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Package.swift', '**/*.swift') }}
          restore-keys: |
            spm-build-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-
            spm-build-${{ runner.os }}-

      - name: Build
        run: ./scripts/build-app.sh

  test:
    name: Test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        id: toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          swift --version
          sw_vers
          version="$(xcodebuild -version | tr '\n' ' ' | tr -c 'A-Za-z0-9.-' '-')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-test-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Package.swift', '**/*.swift') }}
          restore-keys: |
            spm-test-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-
            spm-test-${{ runner.os }}-

      - name: Test
        run: ./scripts/test.sh

  site:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build
